<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liked Videos</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">TV</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li id="userMenuContainer" style="display:none; position:relative;">
          <img src="icons/user.png" id="userIcon" alt="User">
          <div id="userDropdown">
            <a href="playlist.html" class="dropdownItem">Playlist</a>
            <a href="history.html" class="dropdownItem">History</a>
            <a href="likes.html" class="dropdownItem">Likes</a>
            <a href="#" class="dropdownItem" id="logoutBtn">Logout</a>
          </div>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h2 style="text-align:center; margin-top:20px;">Your Liked Videos</h2>
    <div class="video-grid" id="likesGrid"></div>
  </main>

  <!-- Video Modal -->
  <div id="videoModal" class="modal">
    <div class="video-modal-content">
      <button id="closeVideoOutside" class="close-outside">✖ Close</button>
      <div id="videoLoader"><span></span><span></span><span></span></div>
      <div class="video-container">
        <video id="videoPlayer" playsinline></video>
        <div class="controls">
          <button id="playPauseBtn">▶️</button>
          <input type="range" id="seekBar" value="0" min="0" step="0.1">
          <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
          <button id="muteBtn">🔊</button>
          <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="1">
          <button id="fullscreenBtn">⛶</button>
        </div>
      </div>
      <div style="text-align:center; margin-top:10px;">
        <button id="likeButton">❤️ Like</button>
        <span id="likeCount"></span>
      </div>
    </div>
  </div>

  <script src="js/likes.js"></script>
</body>
</html>
