<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist</title>
  <link rel="stylesheet" href="css/playlist.css" />
</head>
<body>
    
  <header>
    <div class="logo">TV</div>
    <nav>
      <ul>
        <li id="userMenuContainer" style="display:none; position:relative;">
          <img src="icons/user.png" id="userIcon" alt="User" style="width:32px; height:32px; border-radius:50%; cursor:pointer;">
          <div id="userDropdown" style="display:none; position:absolute; top:40px; right:0; background-color:#1a1a1a; border:1px solid #ff9900; border-radius:6px; min-width:150px; z-index:200;">
            <a href="playlist.html" class="dropdownItem" id="playlistBtn">Playlist</a>
            <a href="#" class="dropdownItem" id="historyBtn">History</a>
            <a href="#" class="dropdownItem" id="likeBtn">Likes</a>
            <a href="#" class="dropdownItem" id="subscribeBtn">Subscribe</a>
            <a href="#" class="dropdownItem" id="logoutBtn">Logout</a>
          </div>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Your Playlists</h1>
    <div id="playlistContainer" class="playlist-container"></div>

    <form id="createPlaylistForm">
      <input type="text" placeholder="New Playlist Name" required />
      <button type="submit">Create Playlist</button>
    </form>
  </main>

  <script src="js/playlist.js"></script>
</body>
</html>
