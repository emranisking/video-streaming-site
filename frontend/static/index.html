<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV</title>
  <link rel="icon" type="image/png" href="/icons/eye.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo">TV</div>
    <nav>
      <ul>
        <li><a href="#" id="loginBtn">Login</a></li>
        <li><a href="#" id="signupBtn">Create Account</a></li>
        <li id="userMenuContainer" style="display:none; position:relative;">
          <img src="icons/user.png" id="userIcon" alt="User">
          <div id="userDropdown">
            <a href="playlist.html" class="dropdownItem" id="playlistBtn">Playlist</a>
            <a href="history.html" class="dropdownItem" id="historyBtn">History</a>
            <a href="likes.html" class="dropdownItem" id="likeBtn">Likes</a>
            <a href="#" class="dropdownItem" id="subscribeBtn">Subscribe</a>
            <a href="#" class="dropdownItem" id="logoutBtn">Logout</a>
          </div>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Video Grid -->
  <main>
    <div class="video-grid" id="video-grid"></div>
  </main>

  <!-- Login Modal -->
  <div id="loginModal" class="modal">
    <div class="modal-content auth-modal">
      <span class="close" id="loginClose">&times;</span>
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

  <!-- Signup Modal -->
  <div id="signupModal" class="modal">
    <div class="modal-content auth-modal">
      <span class="close" id="signupClose">&times;</span>
      <h2>Create Account</h2>
      <form id="signupForm">
        <input type="text" placeholder="Full Name" required />
        <input type="email" placeholder="Email" required />
        <input type="password" placeholder="Password" required />
        <button type="submit">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Video Modal -->
  <div id="videoModal" class="modal">
    <div class="video-modal-content">
      <button id="closeVideoOutside" class="close-outside">✖ Close</button>

      <!-- Siri-style Loader -->
      <div id="videoLoader">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="video-container">
        <video id="videoPlayer" playsinline></video>

        <div class="controls">
          <button id="playPauseBtn">▶️</button>
          <input type="range" id="seekBar" value="0" min="0" step="0.1">
          <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
          <button id="muteBtn">🔊</button>
          <input type="range" id="volumeBar" min="0" max="1" step="0.05" value="1">
          <button id="fullscreenBtn">⛶</button>
        </div>
      </div>

      <div id="watchLimitMsg"></div>

      <div style="text-align:center; margin-top:10px;">
        <button id="likeButton">❤️ Like</button>
        <span id="likeCount"></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/main.js"></script>
</body>
</html>
